name: Build StudioFlow 360 APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Stage APK for download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/StudioFlow-360.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudioFlow-360-APK
          path: dist/StudioFlow-360.apk
          retention-days: 30

      - name: Publish Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: StudioFlow 360 APK (Build #${{ github.run_number }})
          body: |
            Tap **StudioFlow-360.apk** below to download the Android installer directly to your phone's Downloads / File Explorer.
          files: dist/StudioFlow-360.apk
          make_latest: true
